<div class="container section">
  <app-section-heading
    title="Nosotros"
    [level]="1"
  /><!-- subtitle="Un equipo que entiende de medicina y de cine." -->

  <div class="blocks">
    @for (m of team; track $index) {
      <article class="block reveal" appInView [class.block--alt]="$index % 2 === 1">
        <div class="photo">
          @if (m.photo) {
            <img [src]="m.photo" [alt]="m.name" loading="lazy" width="420" height="420" />
          } @else {
            <span aria-hidden="true">{{ m.name.charAt(0) }}</span>
          }
        </div>
        <div class="text">
          <h2>{{ m.name }}</h2>
          <p class="sub">{{ m.role }}</p>
          <hr class="gold-line" />
          <p>{{ m.bio }}</p>
        </div>
      </article>
    }
  </div>
</div>
