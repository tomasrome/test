<app-page-hero title="Nuestro equipo" subtitle="Un equipo que entiende de medicina y de cine." />

<section class="team">
  <div class="container blocks">
    @for (m of team; track $index) {
      <!-- el 1.º bloque ya se ve al cargar (animación por tiempo); los demás aparecen al hacer scroll -->
      <article
        class="block"
        appInView
        [class.rise]="$index === 0"
        [class.reveal]="$index > 0"
        [class.block--alt]="$index % 2 === 1"
        [style.--i]="$index === 0 ? 2 : 0"
      >
        <div class="photo">
          @if (m.photo) {
            <img [src]="m.photo" [alt]="m.name" loading="lazy" width="420" height="420" />
          } @else {
            <img class="photo__ph" [src]="site.logo" alt="" width="120" height="120" />
          }
        </div>
        <div class="text">
          <p class="eyebrow">{{ m.role }}</p>
          <h2>{{ m.name }}</h2>
          <p>{{ m.bio }}</p>
        </div>
      </article>
    }
  </div>
</section>
