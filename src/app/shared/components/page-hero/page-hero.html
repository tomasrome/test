<section class="ph" [class.dark]="theme() === 'dark'">
  <!-- Decoración (huellas, mancha y trazo dorado). Todo aria-hidden. -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
    <symbol id="paw-ph" viewBox="0 0 100 100">
      <ellipse cx="20" cy="44" rx="11" ry="15" transform="rotate(-22 20 44)" />
      <ellipse cx="39" cy="24" rx="11" ry="15" transform="rotate(-8 39 24)" />
      <ellipse cx="62" cy="24" rx="11" ry="15" transform="rotate(8 62 24)" />
      <ellipse cx="81" cy="44" rx="11" ry="15" transform="rotate(22 81 44)" />
      <path d="M50 46c-16 0-28 14-28 27 0 10 8 14 17 13 4-.5 7-2 11-2s7 1.5 11 2c9 1 17-3 17-13 0-13-12-27-28-27z" />
    </symbol>
  </svg>
  <div class="deco" aria-hidden="true">
    <span class="blob"></span>
    <svg class="paw paw--a"><use href="#paw-ph" /></svg>
    <svg class="paw paw--b"><use href="#paw-ph" /></svg>
    <svg class="swoosh" viewBox="0 0 320 70"><path d="M0 8C70 8 130 14 190 34S270 60 318 62C270 66 190 52 130 32S50 14 0 13Z" /></svg>
  </div>

  <div class="container inner">
    <h1 class="rise">{{ title() }}</h1>
    <svg class="brush" viewBox="0 0 250 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 7C40 3 90 2 140 5S210 7 248 4C205 9 150 8 100 10S30 10 2 7Z" /></svg>
    @if (subtitle()) { <p class="sub rise" style="--i: 1">{{ subtitle() }}</p> }
  </div>
</section>
